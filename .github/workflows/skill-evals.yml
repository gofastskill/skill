name: Skill evals

on:
  push:
    branches: [main]
    paths:
      - 'fastskill/skill-project.toml'
      - 'fastskill/references/eval.md'
      - 'evals/**'
      - '.github/workflows/skill-evals.yml'
  # No `paths:` filter here on purpose. `validate` and `score-fixtures` are
  # required status checks, and a required check that is skipped by a path
  # filter never reports at all — which blocks the pull request forever rather
  # than passing it. Both jobs are deterministic and make no LLM calls, so
  # running them on every pull request is cheap.
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent CLI to run live evals with'
        type: choice
        # claude is the default because checks.toml's required `skill_invoked`
        # check needs structured Skill tool-use events in the trace, which the
        # codex backend never emits (codex has no Skill tool concept). A codex
        # live run will always fail the suite; the option remains only for
        # diagnostic runs of the non-trigger checks.
        options: [claude, codex]
        default: claude
      trials:
        description: 'Trials per case (5 is the spec-001 default)'
        type: string
        default: '5'

concurrency:
  group: skill-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Deterministic, always-on: validate the eval config, suite, and checks schema.
  # No agent, no network calls to an LLM.
  # ----------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FastSkill CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/gofastskill/fastskill/main/scripts/install.sh | bash
          fastskill --version
      - name: Validate eval configuration
        run: |
          cd fastskill
          fastskill eval validate

  # ----------------------------------------------------------------------------
  # Deterministic, always-on: the spec-001 v2 suites. `validate` above reads the
  # manifest's own eval section, which is v1 and names nothing under evals/v2 — so
  # without this job the generated suites, the judge and its prompt are checked by
  # nothing. Still no agent and no LLM: `eval validate` parses a suite, it does not
  # run one, and the judge is read rather than called.
  #
  # Not a required status check. Adding one is a repository setting, and renaming or
  # requiring a check is the kind of change that blocks every open pull request until
  # it reports — so this starts advisory and can be promoted deliberately.
  # ----------------------------------------------------------------------------
  validate-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Suites are generated, never hand-edited
        run: |
          python3 evals/v2/build.py
          if ! git diff --quiet -- evals/v2; then
            echo "::error::evals/v2 does not match patterns.json — run evals/v2/build.py and commit"
            git diff -- evals/v2
            exit 1
          fi
      - name: Every check can still fail
        run: python3 evals/v2/guard_vacuity.py
      - name: Install FastSkill CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/gofastskill/fastskill/main/scripts/install.sh | bash
          fastskill --version
      - name: Validate each suite
        run: |
          for suite in consultation restraint correctness; do
            echo "--- $suite"
            dir="$(evals/v2/stage.sh "$suite" "$RUNNER_TEMP/stage-$suite" 1 | tail -1)"
            (cd "$dir" && fastskill eval validate)
          done

  # ----------------------------------------------------------------------------
  # Deterministic, always-on: exercise the checks engine offline via `eval score`
  # against committed run fixtures — one that must PASS and one that must FAIL.
  # Proves checks.toml scores recorded output correctly, with no agent.
  # ----------------------------------------------------------------------------
  score-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FastSkill CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/gofastskill/fastskill/main/scripts/install.sh | bash
      - name: PASS fixture must score green
        run: fastskill eval score --run-dir evals/fixtures/pass
      - name: FAIL fixture must score red
        run: |
          if fastskill eval score --run-dir evals/fixtures/fail; then
            echo "::error::FAIL fixture unexpectedly passed — checks engine regression"
            exit 1
          fi
          echo "FAIL fixture correctly reported a failing suite."

  # ----------------------------------------------------------------------------
  # Opt-in (workflow_dispatch): run the spec-001 v2 sweep against a REAL agent
  # and a REAL judge. Costs LLM tokens, so it never runs on push/PR.
  #
  # Both halves talk to the same platform LiteLLM gateway, which is reachable on
  # the Tailnet ONLY -- there is no public endpoint, and there is no self-hosted
  # runner. The runner joins the Tailnet itself as an ephemeral `tag:ci` node,
  # exactly as goaikit/aikit's nightly-agent-e2e and gofastskill/fastskill's
  # quality-gateway-smoke do; the node is auto-removed when the job ends.
  #
  # The agent uses the gateway's Anthropic-compatible route (host root); the
  # judge uses the OpenAI-compatible one (`/v1`) on the same host, same key.
  #
  # Required repo secrets -- all five, or the job fails (see the guard below):
  #   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  Tailscale OAuth client, tag:ci
  #   LLM_GATEWAY_URL                       gateway base URL on the Tailnet
  #   LLM_GATEWAY_KEY                       LiteLLM virtual key, budget-scoped
  #   LLM_GATEWAY_MODEL                     AGENT model pin. Must be a model that
  #                                         can serve a Claude-Code-shaped request
  #                                         (see the agent preflight below).
  #
  # Optional:
  #   JUDGE_MODEL                           judge model pin; falls back to
  #                                         LLM_GATEWAY_MODEL. The two roles have
  #                                         different requirements and a single pin
  #                                         cannot satisfy both -- see the preflight.
  #
  # NOTE: aikit supports aikit, claude, codex, cursor, gemini and pi, but
  # `--agent` only accepts a key whose CLI is installed on the runner -- an
  # uninstalled agent fails with RUNTIME_UNKNOWN_ID, same as a typo. The choices
  # below are limited to the two this job installs a CLI for.
  # ----------------------------------------------------------------------------
  live-eval:
    name: Judged sweep (real agent + judge, over the Tailnet)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 42 cases across the three suites, so `trials` N means 42N agent runs plus
    # one judge call per correctness trial. At 60 minutes even trials=1 did not
    # finish; trials=5 is 210 runs and needs the headroom. This is a backstop
    # against a wedged agent, not a target -- the preflights below are what catch
    # a misconfiguration, in seconds rather than by running out the clock.
    timeout-minutes: 180
    permissions:
      contents: read
      # Required by tailscale/github-action to mint an OIDC token for OAuth.
      id-token: write
    steps:
      # This job runs only because a human dispatched it, so an unset secret is
      # a mistake to report, not a condition to quietly skip past. (aikit and
      # fastskill skip instead -- theirs are scheduled and must not page.)
      - name: Verify gateway + Tailscale secrets are configured
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
          LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          LLM_GATEWAY_MODEL: ${{ secrets.LLM_GATEWAY_MODEL }}
        run: |
          missing=""
          for v in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET \
                   LLM_GATEWAY_URL LLM_GATEWAY_KEY LLM_GATEWAY_MODEL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::live-eval was dispatched, but these secrets are unset:$missing"
            exit 1
          fi
          echo "All five secrets are set."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Connect to the Tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # Must be declared in the Tailscale ACL `tagOwners` and granted access
          # to the gateway. The node is ephemeral and auto-removed.
          tags: tag:ci
          # Without this the node joins but keeps the runner's resolver, and the
          # gateway's MagicDNS name does not resolve (curl exit 6). The IP is no
          # substitute: the Tailscale-issued cert is for the DNS name.
          args: --accept-dns=true

      # tailscale/github-action retries `tailscale up` five times and then falls
      # out of its loop -- the step reports SUCCESS even when every attempt was
      # refused. This job's first two runs "connected" that way and then died at
      # the preflight with an unresolvable host, which reads as a DNS fault and
      # is not one. Assert the join rather than trusting the green check.
      - name: Assert the Tailnet join actually happened
        run: |
          if ! ip="$(tailscale ip -4 2>/dev/null)" || [ -z "$ip" ]; then
            echo "::error::not on the Tailnet. The connect step above reports success even when every attempt failed -- read its log for the real reason. A 403 'calling actor does not have enough permissions' means the OAuth client either lacks the auth_keys write scope, or is not authorized for tag:ci in the ACL."
            tailscale status || true
            exit 1
          fi
          echo "on the Tailnet as $ip"

      - name: Install FastSkill CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/gofastskill/fastskill/main/scripts/install.sh | bash
          fastskill --version

      - name: Install agent CLI (${{ inputs.agent }})
        run: |
          case "${{ inputs.agent }}" in
            codex)  npm install -g @openai/codex ;;
            claude) npm install -g @anthropic-ai/claude-code ;;
          esac

      # run.sh already refuses to start a sweep it cannot judge, but it only
      # checks that the variables are SET. Whether the Tailnet grant exists,
      # whether the key is accepted, and whether the model is inside the key's
      # allow-list all fail at the first judge call instead -- which happens
      # after two suites have been paid for in full. Buy that answer up front.
      - name: Preflight -- gateway reachable, key accepted, model served
        env:
          LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
          LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          LLM_GATEWAY_MODEL: ${{ secrets.LLM_GATEWAY_MODEL }}
        run: |
          # One canonical root, both routes derived from it: the secret may or may
          # not already carry a trailing slash or /v1, and guessing wrong sends
          # the agent to /v1/v1/messages.
          root="${LLM_GATEWAY_URL%/}"; root="${root%/v1}"
          judge_url="$root/v1"
          echo "judge endpoint: $judge_url"

          set +e
          models="$(curl -fsS --max-time 30 \
            -H "Authorization: Bearer $LLM_GATEWAY_KEY" \
            "$judge_url/models" 2>"$RUNNER_TEMP/curl.err")"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # Each branch names one actionable cause. The first version of this
            # step collapsed them into "ACL or key", and the first real failure
            # was neither -- it was DNS.
            case "$rc" in
              6)     echo "::error::cannot resolve the gateway host. The runner is on the Tailnet but has not applied MagicDNS -- check --accept-dns=true on the tailscale step." ;;
              7|28)  echo "::error::gateway host resolves but refused or timed out -- the Tailnet ACL most likely does not grant tag:ci access to it." ;;
              22)    echo "::error::gateway answered with an HTTP error -- the key was most likely rejected." ;;
              35|60) echo "::error::TLS failure talking to the gateway -- reaching it by IP instead of its MagicDNS name will do this." ;;
              *)     echo "::error::curl exit $rc talking to the gateway." ;;
            esac
            sed 's/^/  curl: /' "$RUNNER_TEMP/curl.err" >&2 || true
            exit 1
          fi

          if ! echo "$models" | jq -e --arg m "$LLM_GATEWAY_MODEL" \
                 'any(.data[]?.id; . == $m)' >/dev/null; then
            echo "::error::LLM_GATEWAY_MODEL is not served by this key. A virtual key is scoped to a model allow-list; this key serves:"
            echo "$models" | jq -r '.data[]?.id' | sed 's/^/  - /'
            exit 1
          fi
          echo "gateway answered and the pinned model is inside the key's allow-list."
          echo "models this key may use:"
          echo "$models" | jq -r '.data[]?.id' | sed 's/^/  - /'

      # Being inside the allow-list is NOT the same as being able to serve the
      # agent. The check above passes on the OpenAI-compatible route; the agent
      # talks to the Anthropic-compatible one, and a model group can be listed
      # there and still reject what Claude Code sends. That is exactly what
      # happened on run 33889659277: LLM_GATEWAY_MODEL pointed at a group backed
      # by Ollama qwen2.5:7b, every request came back
      #   500 ... {"error":"\"qwen2.5:7b\" does not support thinking"}
      # and the CLI's own 10-attempt backoff turned each deterministic failure
      # into ~4.6 minutes of sleep. 13 cases later the job hit its timeout having
      # done no work at all. Two probes, a few seconds, and that is a hard error
      # in the right place with the right message.
      - name: Preflight -- the AGENT route can serve the pinned model
        if: inputs.agent == 'claude'
        env:
          LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
          LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          LLM_GATEWAY_MODEL: ${{ secrets.LLM_GATEWAY_MODEL }}
        run: |
          root="${LLM_GATEWAY_URL%/}"; root="${root%/v1}"
          echo "agent endpoint: $root/v1/messages"

          # $1 = request body. Echoes the HTTP status; leaves the response
          # body in $RUNNER_TEMP/body.json for the error branches to print.
          # curl's own %{http_code} is already 000 when the request never got a
          # response, so do NOT add a `|| echo 000` fallback on top -- that
          # concatenates and reports "HTTP 000000".
          probe() {
            local code=""
            code="$(curl -sS --max-time 60 -o "$RUNNER_TEMP/body.json" -w '%{http_code}' \
              -X POST "$root/v1/messages" \
              -H "Authorization: Bearer $LLM_GATEWAY_KEY" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d "$1" 2>/dev/null)" || true
            echo "${code:-000}"
          }

          # 000 means no HTTP response at all, which is a connectivity fault
          # rather than anything about the model -- the two preceding steps
          # should have caught it, so say so plainly instead of blaming the pin.
          explain_000() {
            echo "::error::no HTTP response from $root/v1/messages -- the gateway was unreachable on the Anthropic route, even though the judge route answered. Check the Tailnet grant and that the host serves both routes."
          }

          plain='{"model":"'"$LLM_GATEWAY_MODEL"'","max_tokens":16,"messages":[{"role":"user","content":"ping"}]}'
          code="$(probe "$plain")"
          if [ "$code" = "000" ]; then explain_000; exit 1; fi
          if [ "$code" != "200" ]; then
            echo "::error::the Anthropic-compatible route rejected a MINIMAL request for '$LLM_GATEWAY_MODEL' (HTTP $code). The model is allow-listed but this route cannot serve it -- check that LLM_GATEWAY_MODEL names a model group routed to an Anthropic-capable backend."
            sed 's/^/  /' "$RUNNER_TEMP/body.json" >&2 || true
            exit 1
          fi
          echo "minimal request: 200"

          # Claude Code sends an extended-thinking block. A backend can answer
          # the minimal request above and still 500 on this one, which is the
          # failure this whole step exists for -- so probe it explicitly rather
          # than inferring it. max_tokens must exceed budget_tokens.
          thinking='{"model":"'"$LLM_GATEWAY_MODEL"'","max_tokens":1200,"thinking":{"type":"enabled","budget_tokens":1024},"messages":[{"role":"user","content":"ping"}]}'
          code="$(probe "$thinking")"
          if [ "$code" = "000" ]; then explain_000; exit 1; fi
          if [ "$code" != "200" ]; then
            echo "::error::'$LLM_GATEWAY_MODEL' serves a plain request but FAILS one with extended thinking enabled (HTTP $code). Claude Code sends thinking on its very first call, so every case would fail this way. Point LLM_GATEWAY_MODEL at a model group that supports thinking; a small local model generally does not. It can still serve the judge -- set JUDGE_MODEL to it separately."
            sed 's/^/  /' "$RUNNER_TEMP/body.json" >&2 || true
            exit 1
          fi
          echo "thinking request: 200 -- the agent route can serve this model."

      - name: Run the judged sweep
        env:
          # The agent's half. LiteLLM serves the Anthropic-compatible route at
          # the host root; the client appends /v1/messages itself, so
          # ANTHROPIC_BASE_URL is derived from the root below, not passed here.
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_GATEWAY_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.LLM_GATEWAY_MODEL }}
          # The judge's half: same gateway, same key, OpenAI-compatible route.
          # JUDGE_MODEL overrides the placeholder each checks.toml declares.
          LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
          JUDGE_API_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          # Falls back to the agent pin when unset. They are separate because the
          # roles differ: the agent needs a thinking-capable model on the
          # Anthropic route, the judge only needs a competent instruct model on
          # the OpenAI one -- so a model too small to drive the agent can still
          # be a perfectly good (and much cheaper) judge.
          JUDGE_MODEL: ${{ secrets.JUDGE_MODEL || secrets.LLM_GATEWAY_MODEL }}
        run: |
          root="${LLM_GATEWAY_URL%/}"; root="${root%/v1}"
          export ANTHROPIC_BASE_URL="$root"
          export AIKIT_LLM_URL="$root/v1"
          ./evals/v2/run.sh "${{ inputs.agent }}" ./eval-runs/v2 "${{ inputs.trials }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-run-${{ inputs.agent }}
          path: eval-runs/
