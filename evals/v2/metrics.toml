# Metrics for the spec-001 sweep, read by `fastskill eval scorecard`.
#
# One entry per question the sweep answers. `cases` selects by case-id pattern, `*` matching
# any run of characters, so a metric is tied to the ids in patterns.json rather than to the
# directory a suite happens to live in. That is what let the twelve correctness suites
# collapse into one without touching this file's meaning.
#
# `checks` names check *types*, not individual checks. A metric folds every result of those
# types on every matching case into one rate over trials.
#
# Excluded from every rate below, by the tool and not by anything here:
#   - trials with outcome `error`, which produced no measurement (R4)
#   - check results marked not observable on this backend (R9)
# A metric whose pattern matches nothing fails the command rather than disappearing.

# `suites` names the directories this question is asked over, relative to this file. It is
# what makes the scorecard's `benchmark.sha256` computable: the hash covers this file plus
# each suite's checks.toml, prompts.csv and every file a [[judge]] in it references, so two
# scorecards are comparable only when they answered the same question. Absent, the hash is
# null and a comparison against a previous run is refused rather than guessed at.
suites = ["consultation", "restraint", "correctness"]

# ── The four gates of spec 001 section 6 ──────────────────────────────────────

[[metric]]
name = "Skill-open rate"
kind = "check_rate"
cases = ["op-*"]
checks = ["skill_invoked"]
min_rate = 0.85

[[metric]]
name = "Restraint rate"
kind = "check_rate"
cases = ["off-*"]
checks = ["skill_invoked"]
min_rate = 0.90

# Both correctness check types fold into accuracy: eleven cases assert the answer contains
# the right flag, and c-no-publish asserts it does not recommend publishing. Either way the
# question is whether the answer was right.
[[metric]]
name = "Answer accuracy"
kind = "check_rate"
cases = ["c-*"]
checks = ["command_contains", "trigger_expectation"]
min_rate = 0.80

[[metric]]
name = "Tool-budget compliance"
kind = "check_rate"
cases = ["op-*"]
checks = ["max_tool_calls"]
min_rate = 0.90

[[metric]]
name = "Efficiency (p95 tool calls)"
kind = "tool_calls_p95"
cases = ["op-*"]
max = 25

# ── Reported, not gated ───────────────────────────────────────────────────────
#
# Two check results the sweep now produces that spec 001 set no bar for. They are claimed
# here so they are reported rather than named as unread, and `min_rate = 0.0` says the bar
# is absent, not met. Set a real one once there is a baseline to set it from; inventing a
# number now would make an unmeasured threshold look like an agreed one.

[[metric]]
name = "Skill-open rate on correctness prompts (ungated)"
kind = "check_rate"
cases = ["c-*"]
checks = ["skill_invoked"]
min_rate = 0.0

[[metric]]
name = "Tool-budget compliance on correctness prompts (ungated)"
kind = "check_rate"
cases = ["c-*"]
checks = ["max_tool_calls"]
min_rate = 0.0

# The correctness suite's judge reads each answer against the reference in the `expected`
# column and scores it. It is advisory in every sense: the judge declares no `min_score`, so
# it moves no verdict, and both metrics below carry `min_score = 0.0`, so they report without
# gating. `judge_score` reads the recorded judgments rather than the flattened check rows,
# which is why an advisory judge is still measurable here.

[[metric]]
name = "Command-correctness judgment (ungated)"
kind = "judge_score"
cases = ["c-*"]
judges = ["command-correctness"]
min_score = 0.0

# `would_run` is broken out on its own because it is the one thing the checks above
# structurally cannot express. `command_contains` sees the substring it was given and nothing
# around it: `fastskill marketplace create --path ./team-skills --base-url https://...`
# contains the required `--base-url ...` and passes, while `--path` is not a fastskill
# argument and the command would be rejected before it did anything. This criterion asks
# whether the command as written would run at all.
[[metric]]
name = "Command would run as written (ungated)"
kind = "judge_score"
cases = ["c-*"]
judges = ["command-correctness"]
criterion = "would_run"
min_score = 0.0
