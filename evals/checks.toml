# Deterministic scoring applied to every eval case's captured stdout + trace.
# Consumed by `fastskill eval run` (live) and `fastskill eval score` (offline).
# Schema + check types: fastskill/references/eval.md
#
# NOTE: checks are GLOBAL — the same set is applied to every case in the suite,
# so they assert properties that must hold for all (positive) cases.

# The skill's guidance must reference the fastskill CLI.
[[check]]
name = "trigger_expectation"
pattern = "fastskill"
expected = true
required = true

# Guard against runaway agent loops: bound the number of tool calls the agent makes.
#
# The limit is deliberately loose. It exists to catch a pathological loop, not to
# assert an efficient solution — the cases below are exploratory ("list the CLI
# commands"), so a tight bound would fail on a reasonable agent that reads one
# extra file. Tighten it only against observed live-run counts.
[[check]]
name = "max_tool_calls"
limit = 100
required = true
